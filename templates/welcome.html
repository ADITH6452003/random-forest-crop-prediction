<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantGenius | Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --primary-glow: rgba(46, 204, 113, 0.4);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body, html {
            height: 100%;
            background-color: #0b0f19;
            color: var(--text);
            overflow: hidden;
        }

        /* Hero Background with Parallax and Overlay */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url("{{ url_for('static', filename='hero_bg.png') }}") no-repeat center center/cover;
            filter: brightness(0.4) contrast(1.1); /* Cinematic dark overlay */
            z-index: -2;
            transform: scale(1.05); /* Slight scale for parallax trick and breathability */
            animation: breathe 15s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            from { transform: scale(1.02); }
            to { transform: scale(1.08); }
        }

        /* Glassmorphic overlay to ground the text */
        .hero-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 60%;
            background: linear-gradient(to top, rgba(11, 15, 25, 1) 0%, rgba(11, 15, 25, 0) 100%);
            z-index: -1;
        }

        /* Content Container */
        .content {
            text-align: center;
            z-index: 10;
            max-width: 900px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Typography */
        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 1.5rem;
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h1 span {
            background: linear-gradient(135deg, #2ecc71 0%, #3b82f6 50%, #2ecc71 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            animation: shine 4s linear infinite; /* Permanent scrolling shine */
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        p.subtitle {
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            color: #cbd5e1;
            margin-bottom: 3rem;
            max-width: 700px;
            line-height: 1.6;
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s both;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Premium CTA Button */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.05); /* True glass */
            border: 1px solid rgba(255,255,255,0.1);
            border-top: 1px solid rgba(255,255,255,0.3); /* Rim light */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5), 0 0 20px var(--primary-glow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s both;
            position: relative;
            overflow: hidden;
        }

        /* Glow sweep effect */
        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
            transition: all 0.6s ease;
        }

        .cta-btn:hover::before {
            left: 150%;
        }

        .cta-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.5), rgba(59, 130, 246, 0.5));
            border-color: rgba(46, 204, 113, 0.5);
            box-shadow: 0 30px 50px -10px rgba(0, 0, 0, 0.6), 0 0 40px var(--primary-glow);
        }

        .arrow {
            margin-left: 10px;
            transition: transform 0.3s ease;
        }

        .cta-btn:hover .arrow {
            transform: translateX(8px);
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating Glowing Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.5;
            animation: floatOrb 8s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1; /* In front of bg but behind text */
            pointer-events: none;
        }

        .orb-1 { width: 300px; height: 300px; background: rgba(46, 204, 113, 0.4); top: 10%; left: 5%; animation-duration: 12s; }
        .orb-2 { width: 400px; height: 400px; background: rgba(59, 130, 246, 0.3); bottom: -10%; right: -5%; animation-duration: 15s; }
        .orb-3 { width: 250px; height: 250px; background: rgba(139, 92, 246, 0.4); top: 40%; left: 80%; animation-duration: 10s; }
        
        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1) translateX(0); opacity: 0.3; }
            100% { transform: translateY(-50px) scale(1.2) translateX(-20px); opacity: 0.6; }
        }

        /* Dynamic Moving Fireflies / Particles */
        .firefly {
            position: absolute;
            bottom: -20px;
            width: 5px;
            height: 5px;
            background: #a7f3d0; /* Bright glow */
            border-radius: 50%;
            box-shadow: 0 0 10px #a7f3d0, 0 0 20px #2ecc71, 0 0 30px #3b82f6;
            opacity: 0;
            animation: riseUp ease-in infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes riseUp {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            20% { opacity: 0.8; transform: translateY(-20vh) scale(1.5) translateX(20px); }
            80% { opacity: 0.8; transform: translateY(-80vh) scale(1) translateX(-20px); }
            100% { transform: translateY(-110vh) scale(0); opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="hero" id="hero-container">
        <div class="hero-overlay"></div>
        <!-- Ambient Animated Orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        
        <div class="content">
            <h1>The Future of <span>Agronomy</span></h1>
            <p class="subtitle">Harness the power of cutting-edge AI and Machine Learning to optimize your crop yields, accurately forecast market pricing, and build a sustainable smart farm.</p>
            <a href="/dashboard" class="cta-btn">Initialize Dashboard <span class="arrow">→</span></a>
        </div>
    </div>

    <!-- JS to spawn dynamic particles infinitely -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const hero = document.getElementById('hero-container');
            // Generate 40 dynamic fireflies
            for(let i = 0; i < 40; i++) {
                let firefly = document.createElement('div');
                firefly.className = 'firefly';
                
                // Randomize position, duration, and delay
                firefly.style.left = Math.random() * 100 + 'vw';
                firefly.style.animationDuration = (Math.random() * 6 + 4) + 's'; // 4s to 10s
                firefly.style.animationDelay = (Math.random() * 5) + 's';
                
                hero.appendChild(firefly);
            }
        });
    </script>
</body>
</html>
